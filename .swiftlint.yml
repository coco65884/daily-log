included:
  - ios

excluded:
  - ios/DailyLog.xcodeproj
  - ios/build
  - ios/DerivedData
  - ios/.build

disabled_rules:
  - trailing_whitespace  # SwiftFormat が管理

trailing_comma:
  mandatory_comma: true  # SwiftFormat の trailingCommas と合わせる

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - redundant_nil_coalescing
  - sorted_imports

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2

type_name:
  min_length: 3

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 120

reporter: "github-actions-logging"
