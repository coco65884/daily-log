name: DailyLog
options:
  bundleIdPrefix: com.coco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

# Signing (DEVELOPMENT_TEAM など) は xcconfig 経由で注入することで `make generate` の
# たびに Xcode が設定した Team が消える問題を回避。Signing.xcconfig は Signing.local.xcconfig
# (gitignored) を optional include する。
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # SwiftData (@Model は class = 非 Sendable) に対する KeyPath の Sendable 警告が
    # `complete` で大量に出るため minimal に緩和。Swift 6 本格移行時に再評価。
    SWIFT_STRICT_CONCURRENCY: minimal
    # Xcode 16+ の recommended settings を project.yml に反映して再生成後も維持。
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # CODE_SIGN_STYLE と DEVELOPMENT_TEAM は Signing.xcconfig 側で管理。
    # project.yml 側で `DEVELOPMENT_TEAM: ""` を書くと xcconfig の値を空文字で上書きしてしまう。

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

targets:
  DailyLog:
    type: application
    platform: iOS
    sources:
      - path: DailyLog
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.daily-log
        PRODUCT_NAME: DailyLog
        CODE_SIGN_ENTITLEMENTS: DailyLog/DailyLog.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DailyLog
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "音声メモを録音するためにマイクを使用します。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "録音した音声メモを文字起こしするために使用します。"
        INFOPLIST_KEY_NSCameraUsageDescription: "食事記録の写真を撮影するために使用します。"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "食事記録の写真をライブラリから選択するために使用します。"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    dependencies:
      - target: DailyLogWidget
      - package: ZIPFoundation

  DailyLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DailyLogTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.daily-log.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DailyLog

  DailyLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DailyLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coco.daily-log.widget
        PRODUCT_NAME: DailyLogWidget
        CODE_SIGN_ENTITLEMENTS: DailyLogWidget/DailyLogWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DailyLogWidget/Info.plist

schemes:
  DailyLog:
    build:
      targets:
        DailyLog: all
        DailyLogWidget: all
        DailyLogTests: [test]
    test:
      targets:
        - DailyLogTests
      gatherCoverageData: true
    run:
      config: Debug
